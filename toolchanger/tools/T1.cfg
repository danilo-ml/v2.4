# if you want to use this file in your actual tool changer then remove the `example_` from the filename.


# This file contains common pin mappings for the BIGTREETECH EBBT0
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT1]
canbus_uuid:95745797c102 #d643e192d472
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u ac5f7df1a805 -f ~/klipper/out/klipper.bin
[adxl345 T1]
cs_pin: EBBT1: PB12
spi_software_sclk_pin: EBBT1: PB10
spi_software_mosi_pin: EBBT1: PB11
spi_software_miso_pin: EBBT1: PB2
axes_map: x,z,y

[temperature_sensor EBBT1]
sensor_type: temperature_mcu
sensor_mcu: EBBT1 # Change this if your MCU name is different
min_temp: 0
max_temp: 100

[extruder1]
step_pin: EBBT1: PD0
dir_pin: !EBBT1: PD1
enable_pin: !EBBT1: PD2
heater_pin: EBBT1: PB13
sensor_pin: EBBT1: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 22.48
gear_ratio: 50:10	
nozzle_diameter: 0.400
filament_diameter: 1.750
control: pid
pid_Kp: 39.722  #44.282 
pid_Ki: 13.938   #18.451 
pid_Kd: 28.302
min_temp: 0
max_temp: 300
pressure_advance: 0.03
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.03

[tmc2209 extruder1]
uart_pin: EBBT1: PA15
run_current: 0.650
stealthchop_threshold: 0

[heater_fan T1_hotend_fan]
pin: EBBT1: PA0
heater: extruder1
heater_temp: 50.0

[fan_generic T1_partfan]
pin: EBBT1: PA1

[gcode_macro T1]
variable_active: 0
variable_color: ""
variable_spool_id: None
gcode:
    SELECT_TOOL T=1
    _SYNC_SPOOLMAN T=1


#change the tool numbers to the tool you are configuring, ie T0, T1, etc
[tool T1]
#change this too
tool_number: 1
#if this were T1, then this would be extruder1, etc
extruder: extruder1
#Change T0_partfan to tool number
fan: T1_partfan
# Tool offset
gcode_x_offset: -0.131250
gcode_y_offset: -0.931250
gcode_z_offset: -0.545000
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 86.8
params_park_y: 3.7
params_park_z: 251
# For InputShaper run per tool and enter the frequency here
#[input_shaper]
params_input_shaper_type_x: 'ei'
params_input_shaper_freq_x: 83.2
params_input_shaper_type_y: 'ei'
params_input_shaper_freq_y: 75.4


[tool_probe T1]
pin: ^EBBT1:PB6
tool: 1
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
# More positive = More Squish
z_offset: -1.037 # TEXTURED PLATE
#z_offset = -1.290 #-1.390 # SMOOTH PLATE
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder1

# change the neopixel section name to the tool you are configuring:
# T0, T1, etc.
[neopixel T1]
pin: EBBT1:PD3
color_order: GRBW
chain_count: 23
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0