# if you want to use this file in your actual tool changer then remove the `example_` from the filename.

# This file contains common pin mappings for the BIGTREETECH EBBT1
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBT0]
canbus_uuid:7f705ed9147a #8170dfa83388
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -r
# python3 ~/katapult/scripts/flashtool.py -i can0 -u 8170dfa83388 -f ~/klipper/out/klipper.bin
[adxl345 T0]
cs_pin: EBBT0: PB12
spi_software_sclk_pin: EBBT0: PB10
spi_software_mosi_pin: EBBT0: PB11
spi_software_miso_pin: EBBT0: PB2
axes_map: x,z,y

[temperature_sensor EBBT0]
sensor_type: temperature_mcu
sensor_mcu: EBBT0 # Change this if your MCU name is different
min_temp: 0
max_temp: 100

[extruder]
step_pin: EBBT0: PD0
dir_pin: !EBBT0: PD1
enable_pin: !EBBT0: PD2
heater_pin: EBBT0: PB13
sensor_pin: EBBT0: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 22.48
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
control: pid
pid_Kp: 28.867   #44.282 
pid_Ki: 3.055   #18.451 
pid_Kd: 68.198
min_temp: 0
max_temp: 300
pressure_advance: 0.03
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.03

[tmc2209 extruder]
uart_pin: EBBT0: PA15
run_current: 0.650
stealthchop_threshold: 0

[heater_fan T0_hotend_fan]
pin: EBBT0: PA0
heater: extruder
heater_temp: 50.0

[fan_generic T0_partfan]
pin: EBBT0: PA1

[gcode_macro T0]
variable_active: 0
variable_color: ""
variable_spool_id: None
gcode:
    SELECT_TOOL T=0
    _SYNC_SPOOLMAN T=0


#change the tool numbers to the tool you are configuring, ie T1, T1, etc
[tool T0]
#change this too
tool_number: 0
#if this were T1, then this would be extruder1, etc
extruder: extruder
#Change T1_partfan to tool number
fan: T0_partfan

#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 22.1
params_park_y: 3.3
params_park_z: 250
# For InputShaper run per tool and enter the frequency here
# params_input_shaper_type_x: '3hump_ei'
# params_input_shaper_freq_x: 124.2
# #params_input_shaper_damping_ratio_x: 0.098
# params_input_shaper_type_y: 'ei'
# params_input_shaper_freq_y: 81.6
# #params_input_shaper_damping_ratio_y: 0.088
params_input_shaper_type_x: 'ei'
params_input_shaper_freq_x: 87.6
params_input_shaper_type_y: 'ei'
params_input_shaper_freq_y: 77.2

[tool_probe T0]
pin: ^EBBT0:PB6
tool: 0
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
# z_offset: -1.550 # Z axis-sensor relative nozzle offset
z_offset: -1.495
# drop_first_result: True # enable is on danger-klipper
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder TEMP=150

[neopixel T0]
pin: EBBT0:PD3
color_order: GRBW
chain_count: 23
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 1.0